statesClass: com.citi.cpx.statemanager.ar.outgoing.State
eventsClass: com.citi.cpx.statemanager.ar.outgoing.Event
startState: PaymentReceived

states:
  PaymentReceived:
    on_event:
      ValidationPassed:
        target: BankCodeEnrichment
        actions: [persist-payment, start-bank-code-enrichment]
      ValidationFailed:
        target: Rejected
        actions: [persist-rejection, notify-client]

  BankCodeEnrichment:
    on_event:
      EnrichmentSucceeded:
        target: PspEnrichment
        actions: [save-bank-code, start-psp-enrichment]
      EnrichmentRetryableFailure:
        target: BankCodeEnrichment
        actions: [increment-retry, start-bank-code-enrichment]
      EnrichmentTerminalFailure:
        target: Rejected
        actions: [persist-rejection, notify-ops]

  PspEnrichment:
    on_event:
      EnrichmentSucceeded:
        target: SpmRequested
        actions: [save-psp-data, send-spm-request]
      EnrichmentFailed:
        target: Rejected
        actions: [persist-rejection, notify-client]

  SpmRequested:
    on_event:
      SpmCleared:
        target: SanctionsRequested
        actions: [save-spm-result, send-sanctions-request]
      SpmFailed:
        target: Rejected
        actions: [persist-rejection, notify-ops]

  SanctionsRequested:
    on_event:
      SanctionsCleared:
        target: PostingPending
        actions: [save-sanctions-result, start-posting]
      SanctionsPossibleHit:
        target: ComplianceReview
        actions: [persist-hit, notify-compliance]
      SanctionsRejected:
        target: Rejected
        actions: [persist-rejection, notify-client]

  ComplianceReview:
    on_event:
      ReviewCleared:
        target: PostingPending
        actions: [save-review-result, start-posting]
      ReviewRejected:
        target: Rejected
        actions: [persist-rejection, notify-compliance]

  PostingPending:
    on_event:
      PostingAccepted:
        target: SentToClearing
        actions: [persist-posting, send-clearing-message]
      PostingRejected:
        target: Rejected
        actions: [persist-rejection, notify-client]

  SentToClearing:
    on_event:
      ClearingAccepted:
        target: Completed
        actions: [persist-completion, notify-client]
      ClearingRejected:
        target: Rejected
        actions: [persist-rejection, notify-client]

  Completed:
    on_event: {}

  Rejected:
    on_event: {}
